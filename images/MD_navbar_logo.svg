<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <!-- transparent background — fits any navbar -->

  <!-- M -->
  <text x="38" y="38"
    text-anchor="middle"
    font-family="Impact, Arial Black, sans-serif"
    font-size="42" font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-2">M</text>

  <!-- base bar M -->
  <rect x="4"  y="40" width="68" height="3.5" fill="#FF5500"/>
  <rect x="4"  y="43.5" width="68" height="1" fill="#FFFFFF" opacity="0.15"/>
  <rect x="22" y="40" width="3" height="4.5" fill="#0A0A0A"/>
  <rect x="54" y="40" width="3" height="4.5" fill="#0A0A0A"/>

  <!-- center pip -->
  <rect x="78" y="6" width="4" height="36" fill="#FF5500"/>
  <rect x="79.5" y="6" width="1" height="36" fill="#FFFFFF" opacity="0.15"/>

  <!-- D -->
  <text x="122" y="38"
    text-anchor="middle"
    font-family="Impact, Arial Black, sans-serif"
    font-size="42" font-weight="900"
    fill="#FF5500"
    letter-spacing="-2">D</text>

  <!-- base bar D -->
  <rect x="88"  y="40" width="68" height="3.5" fill="#FFFFFF"/>
  <rect x="88"  y="43.5" width="68" height="1" fill="#FF5500" opacity="0.2"/>
  <rect x="106" y="40" width="3" height="4.5" fill="#0A0A0A"/>
  <rect x="138" y="40" width="3" height="4.5" fill="#0A0A0A"/>
</svg>
